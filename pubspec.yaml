name: eye_disease_detection
description: "On-device AI screening of retina (fundus) images for cataract, diabetic retinopathy and glaucoma."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend (Auth + Postgres REST + Storage)
  supabase_flutter: ^2.18.2
  flutter_secure_storage: ^11.2.0
  # On-device ML (TFLite runs natively, see MainActivity.kt)
  image: ">=4.5.4 <4.6.0"
  # Platform
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  # App
  provider: ^6.1.5+1
  pdf: ^3.12.0
  uuid: ^4.6.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
    - assets/disease_info.json
